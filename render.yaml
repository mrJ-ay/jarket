services:
  - type: web
    name: jarket
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ONEID_CLIENT_ID
        value: jarket
      - key: DATABASE_URL
        sync: false
      - key: ONEID_URL
        sync: false
      - key: SLOTS_URL
        sync: false
      - key: PORT
        value: "5505"
